name: Verify

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check backend JavaScript syntax
        run: find controllers db middleware models routes utils -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Test management controllers
        run: node --test tests/*.test.js

  settings-sqlite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend dependencies
        run: npm ci --omit=dev
      - name: Verify SQLite settings migration and rollback
        run: node --test tests/integration/*.test.js

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Test frontend actions
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        run: CI=false npm run build

  browser-e2e:
    needs: [backend, frontend, settings-sqlite]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend dependencies
        run: npm ci --omit=dev
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --prefix client
      - name: Build production frontend
        run: CI=false npm run build --prefix client
      - name: Prepare public assets
        run: mkdir -p public && cp -a client/build/. public/
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npx playwright test --config=playwright.config.js
