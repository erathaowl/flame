name: Verify

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check backend JavaScript syntax
        run: find controllers db middleware models routes utils -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Test management controllers
        run: node --test tests/*.test.js

  settings-sqlite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend dependencies
        run: npm ci --omit=dev
      - name: Verify SQLite settings migration and rollback
        run: node --test tests/integration/*.test.js

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Test frontend actions
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        run: CI=false npm run build
