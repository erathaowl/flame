name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - '.github/release-request.txt'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.normalize.outputs.version }}
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate and normalize version
        id: normalize
        shell: bash
        env:
          SOURCE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -z "$SOURCE_TAG" ]]; then
            SOURCE_TAG="$(head -n 1 .github/release-request.txt | tr -d '[:space:]')"
          fi

          if [[ ! "$SOURCE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Expected vX.Y.Z or vX.Y, got: $SOURCE_TAG"
            exit 1
          fi

          version="${SOURCE_TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]]; then
            version="$version.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          if ! grep -Fxq "VERSION=$version" .env ||
             ! grep -Fxq "REACT_APP_VERSION=$version" client/.env; then
            echo "::error::Application version files must match $version"
            exit 1
          fi

      - name: Prevent overwriting an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RELEASE_TAG: ${{ steps.normalize.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi

          if [[ "$SOURCE_TAG" != "$RELEASE_TAG" ]] && \
             git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Normalized tag $RELEASE_TAG already exists"
            exit 1
          fi

  docker:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=flame
          cache-to: type=gha,mode=max,scope=flame

  publish:
    needs: [version, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          notes_args=(--generate-notes)
          if [[ -f ".github/release-notes/${RELEASE_TAG}.md" ]]; then
            notes_args=(--notes-file ".github/release-notes/${RELEASE_TAG}.md")
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            "${notes_args[@]}"
