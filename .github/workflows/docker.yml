name: Docker Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Optional Docker image tag (overrides the branch tag)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Determine Docker image tag
        id: image
        shell: bash
        env:
          CUSTOM_TAG: ${{ inputs.custom_tag || '' }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$CUSTOM_TAG" ]]; then
            tag="$CUSTOM_TAG"
          elif [[ "$BRANCH_NAME" == "master" ]]; then
            tag="latest"
          else
            tag="$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"
            tag="$(printf '%.128s' "$tag")"
          fi

          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker tag: $tag"
            exit 1
          fi

          tag="$(printf '%s' "$tag" | tr '[:upper:]' '[:lower:]')"
          if [[ "$BRANCH_NAME" != "master" && -z "$CUSTOM_TAG" && "$tag" == "latest" ]]; then
            echo "::error::The latest tag is reserved for master and releases"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=flame
          cache-to: type=gha,mode=max,scope=flame
