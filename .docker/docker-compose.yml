services:
  flame:
    image: ghcr.io/erathaowl/flame:v2.5.1
    container_name: flame
    restart: unless-stopped
    ports:
      - "5005:5005"
    volumes:
      - /path/to/host/data:/app/data
      # Enable only when Docker integration is required:
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PASSWORD: change_me
